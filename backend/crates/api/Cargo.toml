[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# Le crate porte deux binaires depuis la bascule du site : le serveur et
# l'export du document OpenAPI. Sans cette ligne, `cargo run -p api` — la
# commande écrite dans CLAUDE.md — refuse de choisir.
default-run = "api"

[dependencies]
kernel.workspace = true
identity.workspace = true
org.workspace = true
event.workspace = true
programme.workspace = true
media.workspace = true
engagement.workspace = true

actix-web.workspace = true
dotenvy.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["testing"] }
