[package]
name = "negotiation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Principe II : un crate de module ne dépend QUE de kernel et de contracts.
# En particulier PAS d'`identity`, dont ce module lit pourtant les tables : le
# RBAC se teste par `identity.has_permission()`, une fonction SQL, et le
# courriel de décision part par l'outbox — jamais par un appel de crate.
[dependencies]
kernel.workspace = true
contracts.workspace = true

actix-web.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["testing"] }
# L'essai d'extraction seulement (`examples/essai_extraction.rs`), jusqu'à la
# décision de specs/011 : PDFium ne passe en dépendance normale qu'après.
image.workspace = true
pdfium-render.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true
