# Déploiement — ePavillon v2, serveur applicatif
#
#   docker compose --env-file .env.prod -f ops/docker-compose.prod.yml up -d --build
#
# **AUCUN SERVEUR WEB ICI, ET C'EST LE POINT CENTRAL.** Le VPS est un cPanel :
# son Apache tient déjà les ports 80 et 443 pour `financedurable.francophonie.org`,
# en production. Un conteneur qui les réclamerait ne démarrerait pas — ou pire,
# démarrerait et couperait ce site. C'est l'Apache du VPS qui termine le TLS et
# proxifie, greffé par `ops/apache-epavillon.conf` ; voir `docs/DEPLOIEMENT.md`.
#
# **Les deux seuls ports publiés le sont sur `127.0.0.1`**, jamais sur toutes
# les interfaces : rien de cette pile n'est joignable depuis l'extérieur, et
# aucune règle de redirection n'échappe au pare-feu du serveur. Le port 3000
# est déjà pris par l'application de `financedurable` — d'où 3100.
#
# Pas de Mailpit ni de Jaeger : le courriel part vraiment, par le serveur du
# domaine, et aucun collecteur de traces n'est déployé.
#
# **Le schéma n'est chargé qu'au PREMIER démarrage du volume de la base.** Après
# toute modification de `docs/database/`, il faut le rejouer à la main : un
# `down -v` en production effacerait les données.

name: epavillon

networks:
  interne:
    ipam:
      config:
        # Sous-réseau FIXÉ, et c'est ce qui rend `TRUSTED_PROXIES` écrivable :
        # Docker en choisirait un autre à la première recréation, et l'API
        # cesserait alors de croire son propre frontal — enregistrant l'adresse
        # de Caddy à la place de celle de chaque visiteur, sans erreur.
        - subnet: 172.28.0.0/16

services:
  front:
    build:
      context: ../frontend
      args:
        NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/v2/}
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/v2/api}
        NUXT_PUBLIC_SITE_URL: ${APP_PUBLIC_URL:?adresse publique complète}
    restart: unless-stopped
    networks: [interne]
    environment:
      # Le rendu serveur ne peut pas appeler un CHEMIN : il n'a pas d'origine.
      # Cette adresse interne est lue par le seul serveur, jamais par le
      # navigateur, qui garde `/v2/api` — donc une seule origine et pas de CORS.
      NUXT_API_BASE_SERVER: http://api:8080/api
    ports:
      - "127.0.0.1:${FRONT_PORT:-3100}:3000"

  api:
    build:
      context: ../backend
    command: ["api"]
    restart: unless-stopped
    networks: [interne]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    env_file: [../.env.prod]
    environment:
      # Toutes les interfaces DU CONTENEUR, ce qui n'expose rien : la
      # publication ci-dessus le lie à `127.0.0.1` de l'hôte. Mettre
      # `127.0.0.1` ici rendrait l'API injoignable, la boucle d'un conteneur
      # n'étant pas celle de l'hôte.
      API_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?mot de passe de la base}@postgres:5432/epavillon
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      postgres: {condition: service_healthy}

  worker:
    build:
      context: ../backend
    command: ["worker"]
    restart: unless-stopped
    networks: [interne]
    env_file: [../.env.prod]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?mot de passe de la base}@postgres:5432/epavillon
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://garage:3900
    depends_on:
      postgres: {condition: service_healthy}

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks: [interne]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe de la base}
      POSTGRES_DB: epavillon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/database:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d epavillon"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    networks: [interne]
    command: valkey-server --save 60 1
    volumes:
      - valkey-data:/data

  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    networks: [interne]
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage.toml:/etc/garage.toml:ro

volumes:
  pgdata:
  valkey-data:
  garage-meta:
  garage-data:
