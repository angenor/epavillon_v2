# À déposer dans `public_html/v2/.htaccess` sur le cPanel — et NULLE PART
# AILLEURS. Le fichier de la racine sert la v1 : n'y toucher qu'au jour de la
# bascule.
#
# Ce que ce fichier fait, en une phrase : tout ce qui arrive sous `/v2` repart
# vers le serveur applicatif, et le visiteur ne le sait pas.
#
# ATTENTION AU CHEMIN CAPTURÉ. Dans le `.htaccess` d'un sous-dossier, la règle
# reçoit le chemin AMPUTÉ du dossier : la demande `/v2/evenement/cop31` lui
# arrive comme `evenement/cop31`. C'est pourquoi la cible réintroduit `/v2/` —
# l'omettre servirait la racine du site applicatif, où Nuxt ne répond pas.
#
# ET LA CIBLE EST EN HTTPS. Relayer vers l'adresse IP en clair ferait traverser
# l'Internet public aux cookies de session, à l'insu du navigateur, qui voit une
# connexion sécurisée de bout en bout et n'a aucun moyen d'apprendre qu'elle ne
# l'est pas.
#
# CE QU'ON NE PEUT PAS ÉCRIRE ICI : `ProxyPassReverse`, `ProxyPreserveHost` et
# leurs parentes sont refusées en `.htaccess` — Apache ne les accepte qu'en
# configuration de serveur. Les y mettre ne donne pas un avertissement mais une
# **erreur 500 sur tout le dossier**. La réécriture des redirections passe donc
# par `mod_headers`, qui, lui, est autorisé.

RewriteEngine On
RewriteBase /v2/

# `[P]` relaie, `[QSA]` conserve la chaîne de requête, `[L]` arrête là.
RewriteRule ^(.*)$ https://epavillon.mefali.com/v2/$1 [P,L,QSA]

<IfModule mod_headers.c>
    # Une redirection posée par le serveur applicatif porterait l'adresse de
    # transport : le visiteur la verrait apparaître dans sa barre d'adresse, et
    # sortirait du domaine institutionnel sans l'avoir demandé.
    Header edit Location "^https://epavillon\.mefali\.com/v2/" "https://epavillonclimatique.francophonie.org/v2/"

    # `edit*` et non `edit` : `Set-Cookie` arrive en plusieurs exemplaires — un
    # par cookie —, et `edit` seul ne corrigerait que le premier. La règle ne
    # sert que de filet : l'API pose ses cookies SANS attribut `Domain`, donc
    # le navigateur les rattache déjà à l'hôte qu'il a contacté.
    Header edit* Set-Cookie ";\s*Domain=epavillon\.mefali\.com" ""
</IfModule>
