# Vhost d'ePavillon v2 — à greffer sur l'Apache du VPS.
#
# ┌─ OÙ CE FICHIER VA, ET POURQUOI LÀ ──────────────────────────────────────┐
# │ /etc/apache2/conf.d/includes/post_virtualhost_global.conf                │
# │ puis : apachectl configtest && systemctl reload apache2                  │
# │                                                                          │
# │ cPanel RÉGÉNÈRE `httpd.conf` — à la création d'un compte, au renouvelle- │
# │ ment d'un certificat, à une mise à jour du panneau. Un `VirtualHost`     │
# │ écrit dans ce fichier-là disparaîtrait sans prévenir. Les fichiers de    │
# │ `conf.d/includes/`, eux, sont RÉFÉRENCÉS par la configuration engendrée  │
# │ et jamais réécrits : `post_virtualhost_global.conf` est inclus après     │
# │ tous les vhosts du panneau.                                              │
# │                                                                          │
# │ Conséquence heureuse : le domaine n'a PAS à être déclaré dans cPanel.    │
# │ Pas de compte à créer — la licence n'en autorise qu'un —, pas de domaine │
# │ additionnel greffé sur celui de `financedurable`, et donc aucune de ses  │
# │ limites à modifier. Le certificat vient de certbot et non d'AutoSSL,     │
# │ pour la même raison : AutoSSL ne couvre que ce que le panneau connaît.   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Apache choisit un vhost par son `ServerName`. Celui-ci étant unique sur la
# machine, il ne peut pas capter le trafic de `financedurable` — et comme il
# est chargé EN DERNIER, il ne peut pas non plus devenir le vhost par défaut.
#
# ┌─ L'ADRESSE IP EST EXPLICITE, ET CE N'EST PAS UN DÉTAIL ─────────────────┐
# │ cPanel déclare ses vhosts sur `173.209.36.111:80`, jamais sur `*:80`.   │
# │ Apache traite les deux comme des ensembles SÉPARÉS : un vhost générique │
# │ n'est jamais consulté pour une adresse qui a les siens. Le symptôme est │
# │ une page 404 de cPanel, qui fait chercher du côté des chemins et des    │
# │ droits pendant que la cause est ici. Si l'IP du serveur change, ces deux│
# │ lignes changent aussi.                                                  │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Et le service s'appelle `httpd`, pas `apache2` : `systemctl reload apache2`
# échoue sur « Unit not found », mais `httpd -S` lit la configuration SUR LE
# DISQUE — un vhost peut donc y figurer sans être chargé en mémoire, ce qui
# fait croire à un problème de configuration là où le rechargement n'a
# simplement jamais eu lieu.

# ── HTTP : le défi ACME, et rien d'autre ─────────────────────────────────────
<VirtualHost 173.209.36.111:80>
    ServerName epavillon.mefali.com

    # Le renouvellement du certificat passe par ici. Sans cet alias, certbot ne
    # peut pas prouver qu'on tient le domaine, et le certificat expire au bout
    # de quatre-vingt-dix jours — silencieusement, jusqu'à ce que le site
    # devienne inaccessible.
    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot">
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://epavillon.mefali.com$1 [R=301,L]
</VirtualHost>

# ── HTTPS : le proxy vers la pile Docker ─────────────────────────────────────
<VirtualHost 173.209.36.111:443>
    ServerName epavillon.mefali.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/epavillon.mefali.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/epavillon.mefali.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On

    # Deux minutes. Le rendu d'une page de programmation interroge la base
    # plusieurs fois ; le défaut de 60 s coupe au mauvais moment sous charge.
    ProxyTimeout 120

    # 200 Mio — le poids du fond vidéo de la page d'accueil, plafond que la
    # configuration de l'API déclare aussi. **Sans cette ligne, le refus vient
    # d'Apache** et l'application n'en sait rien : l'écran affiche une erreur de
    # réseau sans cause, là où l'API aurait dit ce qui dépasse.
    LimitRequestBody 209715200

    # ── L'API D'ABORD ────────────────────────────────────────────────────────
    # Apache retient la PREMIÈRE règle qui correspond : placer `/v2/` avant
    # enverrait les appels d'API au site, qui rendrait sa page 404 — avec un
    # code 200, donc sans que rien n'ait l'air cassé.
    #
    # Le préfixe `/v2` est retiré : les routes du serveur Rust sont montées sur
    # `/api`, et la cohabitation avec la v1 est une affaire d'hébergement, pas
    # d'application. Le jour de la bascule à la racine, ces quatre lignes
    # perdent leur `/v2` et rien d'autre ne bouge.
    ProxyPass        /v2/api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /v2/api/ http://127.0.0.1:8080/api/

    # ── LE SITE GARDE SON PRÉFIXE ────────────────────────────────────────────
    # Nuxt est construit avec `NUXT_APP_BASE_URL=/v2/` et attend ses propres URL
    # préfixées : les lui retirer ferait répondre 404 à sa propre page d'accueil.
    ProxyPass        /v2/ http://127.0.0.1:3100/v2/
    ProxyPassReverse /v2/ http://127.0.0.1:3100/v2/

    # `/v2` sans barre finale ne correspond à aucune des règles ci-dessus —
    # Apache ne complète pas un `ProxyPass` comme il complète un dossier.
    RedirectMatch permanent ^/v2$ /v2/

    # Rien d'autre n'est servi : cette adresse est une adresse de TRANSPORT,
    # que personne n'est censé taper. Un 404 nu vaut mieux qu'une page d'accueil
    # qui laisserait croire qu'elle est l'adresse du site.
    ErrorLog  /var/log/apache2/epavillon-error.log
    CustomLog /var/log/apache2/epavillon-access.log combined
</VirtualHost>
