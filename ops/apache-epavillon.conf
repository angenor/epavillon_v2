# Vhosts d'ePavillon v2 — à greffer sur l'Apache du VPS.
#
# ┌─ OÙ CE FICHIER VA, ET POURQUOI LÀ ──────────────────────────────────────┐
# │ /etc/apache2/conf.d/includes/post_virtualhost_global.conf                │
# │ puis : apachectl configtest && systemctl reload httpd                    │
# │ (c'est ce que fait `./deploy.sh vhost`, voisin mesuré avant et après)    │
# │                                                                          │
# │ cPanel RÉGÉNÈRE `httpd.conf` — à la création d'un compte, au renouvelle- │
# │ ment d'un certificat, à une mise à jour du panneau. Un `VirtualHost`     │
# │ écrit dans ce fichier-là disparaîtrait sans prévenir. Les fichiers de    │
# │ `conf.d/includes/`, eux, sont RÉFÉRENCÉS par la configuration engendrée  │
# │ et jamais réécrits : `post_virtualhost_global.conf` est inclus après     │
# │ tous les vhosts du panneau.                                              │
# │                                                                          │
# │ Conséquence heureuse : le domaine n'a PAS à être déclaré dans cPanel.    │
# │ Pas de compte à créer — la licence n'en autorise qu'un —, pas de domaine │
# │ additionnel greffé sur celui de `financedurable`, et donc aucune de ses  │
# │ limites à modifier. Les certificats viennent de certbot et non d'AutoSSL,│
# │ pour la même raison : AutoSSL ne couvre que ce que le panneau connaît.   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Apache choisit un vhost par son `ServerName`. Ceux-ci étant uniques sur la
# machine, ils ne peuvent pas capter le trafic de `financedurable` — et comme
# ils sont chargés EN DERNIER, aucun ne peut devenir le vhost par défaut.
#
# ┌─ L'ADRESSE IP EST EXPLICITE, ET CE N'EST PAS UN DÉTAIL ─────────────────┐
# │ cPanel déclare ses vhosts sur `173.209.36.111:80`, jamais sur `*:80`.   │
# │ Apache traite les deux comme des ensembles SÉPARÉS : un vhost générique │
# │ n'est jamais consulté pour une adresse qui a les siens. Le symptôme est │
# │ une page 404 de cPanel, ou ici le site voisin, servi comme vhost par    │
# │ défaut. Si l'IP du serveur change, ces lignes changent aussi.           │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Et le service s'appelle `httpd`, pas `apache2` : `systemctl reload apache2`
# échoue sur « Unit not found », mais `httpd -S` lit la configuration SUR LE
# DISQUE — un vhost peut donc y figurer sans être chargé en mémoire.
#
# ┌─ DEUX NOMS, UN SITE (26/10) ────────────────────────────────────────────┐
# │ L'OIF a fait pointer `epavillonclimatique.francophonie.org` ici : le    │
# │ site y est servi À LA RACINE, sans le `/v2` de la cohabitation avec la  │
# │ v1. `epavillon.mefali.com`, l'adresse de recette, ne sert plus rien :   │
# │ elle redirige, et ne garde que son défi ACME pour que son certificat    │
# │ n'expire pas sous les liens déjà partagés.                              │
# └─────────────────────────────────────────────────────────────────────────┘

# ── HTTP : le défi ACME, et rien d'autre ─────────────────────────────────────
# Sans l'alias, certbot ne peut pas prouver qu'on tient le domaine, et le
# certificat expire au bout de quatre-vingt-dix jours — silencieusement,
# jusqu'à ce que le site devienne inaccessible.
<VirtualHost 173.209.36.111:80>
    ServerName epavillonclimatique.francophonie.org

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot">
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://epavillonclimatique.francophonie.org$1 [R=301,L]
</VirtualHost>

<VirtualHost 173.209.36.111:80>
    ServerName epavillon.mefali.com

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot">
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(?:v2/?)?(.*)$ https://epavillonclimatique.francophonie.org/$1 [R=301,L]
</VirtualHost>

# ── HTTPS : le proxy vers la pile Docker ─────────────────────────────────────
# `<IfFile>` : tant que le certificat n'est pas émis, ce vhost n'existe pas, et
# `configtest` passe. Sans lui, le premier dépôt échouerait sur un fichier
# absent — et le certificat ne peut s'obtenir qu'après ce dépôt, qui ouvre le
# défi ACME ci-dessus. Le domaine retombe alors sur le vhost par défaut de
# l'adresse, celui du voisin : rien de cassé, juste le mauvais site.
<IfFile "/etc/letsencrypt/live/epavillonclimatique.francophonie.org/fullchain.pem">
<VirtualHost 173.209.36.111:443>
    ServerName epavillonclimatique.francophonie.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/epavillonclimatique.francophonie.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/epavillonclimatique.francophonie.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On

    # Deux minutes. Le rendu d'une page de programmation interroge la base
    # plusieurs fois ; le défaut de 60 s coupe au mauvais moment sous charge.
    ProxyTimeout 120

    # 200 Mio — le poids du fond vidéo de la page d'accueil, plafond que la
    # configuration de l'API déclare aussi. **Sans cette ligne, le refus vient
    # d'Apache** et l'application n'en sait rien : l'écran affiche une erreur de
    # réseau sans cause, là où l'API aurait dit ce qui dépasse.
    LimitRequestBody 209715200

    # ── LES ANCIENNES ADRESSES DE RECETTE ────────────────────────────────────
    # Des liens en `/v2/…` circulent déjà. `ProxyPass` passe AVANT
    # `RedirectMatch` (mod_proxy traduit le chemin le premier) : sans
    # l'exclusion, `/v2/…` partirait au site, qui rendrait sa page 404.
    ProxyPassMatch ^/v2(/.*)?$ !
    RedirectMatch permanent ^/v2(?:/(.*))?$ /$1

    # ── L'API D'ABORD ────────────────────────────────────────────────────────
    # Apache retient la PREMIÈRE règle qui correspond : placer `/` avant
    # enverrait les appels d'API au site, qui rendrait sa page 404 — avec un
    # code 200, donc sans que rien n'ait l'air cassé.
    #
    # ModSecurity (OWASP CRS de cPanel) n'admet que GET, HEAD, POST et OPTIONS : les
    # PUT, PATCH et DELETE de l'API tombaient en 403 avant de l'atteindre (27/09).
    # Seule la règle des méthodes est retirée, et pour l'API seulement.
    <LocationMatch "^/api/">
        <IfModule mod_security2.c>
            SecRuleRemoveById 911100
        </IfModule>
    </LocationMatch>
    ProxyPass        /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # ── LES MÉDIAS, AVANT LE SITE ────────────────────────────────────────────
    # Même raison d'ordre : placée après, cette règle ne serait jamais atteinte
    # et Nuxt rendrait sa page 404 à la place de chaque image.
    #
    # Le relais traduit le chemin en sous-domaine Garage (`ops/media-proxy.conf`).
    # Les médias restent ainsi sur l'ORIGINE DU SITE : `media.public_base_url`
    # vaut `<adresse publique>/media`.
    ProxyPass        /media/ http://127.0.0.1:3120/
    ProxyPassReverse /media/ http://127.0.0.1:3120/

    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    ErrorLog  /var/log/apache2/epavillon-error.log
    CustomLog /var/log/apache2/epavillon-access.log combined
</VirtualHost>
</IfFile>

# L'adresse de recette renvoie à l'adresse publique, `/v2` retiré. Le
# certificat reste renouvelé : un lien partagé en HTTPS doit encore aboutir.
<VirtualHost 173.209.36.111:443>
    ServerName epavillon.mefali.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/epavillon.mefali.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/epavillon.mefali.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    RedirectMatch permanent ^/(?:v2/?)?(.*)$ https://epavillonclimatique.francophonie.org/$1

    ErrorLog  /var/log/apache2/epavillon-error.log
    CustomLog /var/log/apache2/epavillon-access.log combined
</VirtualHost>
