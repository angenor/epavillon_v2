# Accès public aux objets — DÉVELOPPEMENT ET PRODUCTION.
#
# Le modèle compose l'URL d'un média en CHEMIN — `<base>/<bucket>/<clé>` —, ce
# que sert n'importe quel stockage objet en « path-style », et ce que fera le
# domaine média en production. Garage, lui, n'ouvre ses objets à la lecture
# anonyme que par SOUS-DOMAINE (`epavillon.web.garage.localhost`) : son API S3
# exige une signature, et son point d'accès web ignore le préfixe du bucket.
#
# Sans cette pièce, aucun média téléversé n'est visible dans le navigateur en
# développement — ni une bannière de vitrine, ni une couverture d'activité. Le
# constat a été fait le 24/08, au premier téléversement réel.
#
# Le besoin est le MÊME en production : Garage y sert les mêmes objets par les
# mêmes sous-domaines. Le compose de production monte donc ce fichier lui aussi,
# et l'Apache du VPS lui envoie `/v2/media/` — ce qui garde les médias sur
# l'origine du site, sans entrée DNS ni certificat de plus.
#
# Ce fichier traduit le chemin en sous-domaine, et rien d'autre : ni cache, ni
# droits. Les objets d'un bucket ouvert en lecture web sont PUBLICS, et c'est
# `media.assets.visibility` qui décide de ce qui y est déposé.
server {
    listen 80;
    server_name _;

    location ~ ^/([^/]+)/(.*)$ {
        resolver 127.0.0.11 valid=30s;
        set $bucket $1;
        set $objet  $2;
        proxy_set_header Host "$bucket.web.garage.localhost";
        proxy_pass http://garage:3902/$objet$is_args$args;
    }
}
