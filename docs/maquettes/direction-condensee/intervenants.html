<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intervenants : direction condensée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../journees-speciales/commun/jetons.css">
<link rel="stylesheet" href="style.css">
<style>
  [hidden] { display: none !important; }
  .page { padding: 40px 0 80px; }
  .note { max-width: 70ch; margin: 0 0 28px; color: var(--color-text-secondary); line-height: 1.55; }
  .main { max-width: 820px; }
  h2.sec { margin: 0 0 18px; font-family: var(--font-heading); font-weight: 700; font-size: clamp(1.8rem, 3.4vw, 2.3rem); line-height: 1; color: var(--ink); }

  /* Carte verticale : photo, nom, rôle, puis fonction et organisation coupées par des points de suspension. */
  .speakers { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; }
  .speaker { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; padding: 20px 14px 18px; border: 1px solid var(--color-border-subtle); border-radius: var(--radius-lg); background: var(--card); font: inherit; color: inherit; text-align: center; cursor: pointer; transition: border-color 0.15s; }
  .speaker:hover { border-color: var(--day-solid); }
  .speaker:focus-visible { outline: 3px solid var(--color-accent); outline-offset: 2px; }
  .avatar { display: grid; place-items: center; flex: none; width: 96px; height: 96px; border-radius: 50%; background: var(--day-tint); border: 3px solid var(--day-solid); font-family: var(--font-heading); font-weight: 700; font-size: 1.9rem; color: var(--day-ink); }
  .speaker b { display: block; margin-top: 14px; font-family: var(--font-heading); font-weight: 700; font-size: 1.3rem; line-height: 1.05; color: var(--ink); }
  .speaker .role { margin-top: 6px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--day-ink); }
  .speaker .job { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; margin-top: 10px; font-size: 0.86rem; line-height: 1.4; color: var(--color-text-secondary); }
  .speaker .org { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 4px; font-size: 0.82rem; line-height: 1.35; font-weight: 600; color: var(--color-text-muted); }
  @media (max-width: 480px) {
    .speakers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .speaker { padding: 16px 10px 14px; }
    .avatar { width: 76px; height: 76px; font-size: 1.5rem; }
    .speaker b { font-size: 1.15rem; }
  }

  /* Fenêtre de l'intervenant : tout ce qui est public, rien de plus (ni courriel ni téléphone). */
  .backdrop { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgb(29 26 91 / 0.55); }
  .dialog { position: relative; width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto; border-radius: var(--radius-lg); background: var(--card); box-shadow: var(--shadow-xl); }
  .dialog-head { display: flex; gap: 18px; align-items: center; padding: 24px 56px 20px 24px; background: var(--day-tint); border-bottom: 4px solid var(--day-solid); }
  .dialog-head .avatar { width: 104px; height: 104px; background: var(--card); }
  .dialog-head b { display: block; font-family: var(--font-heading); font-weight: 700; font-size: 1.7rem; line-height: 1.02; color: var(--ink); }
  .dialog-head .role { display: block; margin-top: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--day-ink); }
  .close { position: absolute; top: 10px; right: 10px; display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: var(--radius); background: transparent; color: var(--ink); cursor: pointer; }
  .close:hover { background: var(--color-surface-sunken); }
  .close svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
  .dialog-body { padding: 22px 24px 26px; }
  .dialog dl { margin: 0; display: grid; gap: 16px; }
  .dialog dt { font-family: var(--font-heading); font-weight: 600; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-muted); }
  .dialog dd { margin: 4px 0 0; line-height: 1.55; color: var(--color-text); }
  @media (max-width: 480px) {
    .dialog-head { flex-direction: column; text-align: center; padding: 24px 20px 18px; }
  }
</style>
</head>
<body class="day-finance">
<main class="page wrap">
  <p class="note">Intervenants d'une activité, en colonnes. Une fonction ou une organisation trop longue s'arrête sur des points de suspension ; un clic sur la carte ouvre la fenêtre avec tout ce qui est public. Le courriel n'y figure jamais. Essayez la deuxième carte.</p>

  <section class="main">
    <h2 class="sec">Intervenants</h2>
    <ul class="speakers">
      <li><button class="speaker" type="button" data-i="0"><span class="avatar">AD</span><b>Aminata Diallo</b><span class="role">Modératrice</span><span class="job">Secrétaire générale</span><span class="org">Association internationale des Régions francophones (AIRF)</span></button></li>
      <li><button class="speaker" type="button" data-i="1"><span class="avatar">CR</span><b>Claire Rousseau-Martin</b><span class="role">Intervenante</span><span class="job">Première adjointe au maire, chargée de l'action municipale pour une ville plus juste et plus verte, de la santé publique, de la santé environnementale, des affaires internationales et de la coopération décentralisée</span><span class="org">Ville de Marseille</span></button></li>
      <li><button class="speaker" type="button" data-i="2"><span class="avatar">IB</span><b>Issa Bado</b><span class="role">Intervenant</span><span class="job">Spécialiste de programme</span><span class="org">Institut de la Francophonie pour le développement durable (IFDD)</span></button></li>
      <li><button class="speaker" type="button" data-i="3"><span class="avatar">JH</span><b>Jean Houngbo</b><span class="role">Intervenant</span><span class="job">Maire</span><span class="org">Commune de Sakété, Bénin</span></button></li>
    </ul>
  </section>
</main>

<div class="backdrop" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="d-nom">
    <button class="close" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="dialog-head">
      <span class="avatar" id="d-init"></span>
      <div><b id="d-nom"></b><span class="role" id="d-role"></span></div>
    </div>
    <div class="dialog-body">
      <dl>
        <div><dt>Fonction</dt><dd id="d-job"></dd></div>
        <div><dt>Organisation</dt><dd id="d-org"></dd></div>
        <div id="d-bio-wrap"><dt>Biographie</dt><dd id="d-bio"></dd></div>
      </dl>
    </div>
  </div>
</div>

<script src="icones.js"></script>
<script>
{
  const bios = [
    "Elle anime depuis 2019 le réseau des régions francophones engagées dans l'adaptation et suit les négociations sur le financement climatique des collectivités.",
    "Élue depuis 2020, elle porte la coopération de la ville avec les communes d'Afrique de l'Ouest sur la santé environnementale et l'adaptation des quartiers aux vagues de chaleur.",
    "",
    "Maire depuis 2020, il conduit le programme communal de reboisement et de finance verte porté avec les groupements de femmes de Sakété."
  ];
  const backdrop = document.querySelector('.backdrop');
  let opener = null;
  const close = () => { backdrop.hidden = true; opener?.focus(); };
  document.querySelectorAll('.speaker').forEach((card) => card.addEventListener('click', () => {
    opener = card;
    document.getElementById('d-init').textContent = card.querySelector('.avatar').textContent;
    document.getElementById('d-nom').textContent = card.querySelector('b').textContent;
    document.getElementById('d-role').textContent = card.querySelector('.role').textContent;
    document.getElementById('d-job').textContent = card.querySelector('.job').textContent;
    document.getElementById('d-org').textContent = card.querySelector('.org').textContent;
    const bio = bios[card.dataset.i];
    document.getElementById('d-bio').textContent = bio;
    document.getElementById('d-bio-wrap').hidden = !bio;
    backdrop.hidden = false;
    backdrop.querySelector('.close').focus();
  }));
  backdrop.querySelector('.close').addEventListener('click', close);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !backdrop.hidden) close(); });
}
</script>
</body>
</html>
